name: MacOS Arm64 Build

# ═══════════════════════════════════════════════════════════════════
# ⚠️ 日常禁止全量构建：push master 不要跑多平台多版本
#
# 背景（2026-11-14）：改了 7 个 .rs 就触发 4 个平台 workflow（Android NDK
#   r27d/r28c/r29/r30 × 多 LLVM 版本 + linux-arm64 + linux-x64 + macos-arm64），
#   一次 push 烧掉大量 runner 时间，真正要看的编译错误却只要一个平台就够了。
#
# 规则：
#   · 改完代码要验证编译 → 只手动跑【一个】平台的一个版本：
#       gh workflow run build-android-ndk.yml -f ...   （或只跑 ubuntu 那个 job）
#   · 本文件保留 push 触发是为了「合并前兜底」，但日常开发请用 PR，
#     或临时把下面的 paths 收窄到你确定要跑的范围再 push。
#   · 真正需要全平台的时机：发版（打 tag → release.yml）、改 LLVM 相关代码、
#     改 cpp/ 或 runtime 层。纯业务逻辑改动不需要。
#
# 若本平台的构建常年不需要，直接注释掉 push 触发器、只留 workflow_dispatch，
# 把它变成「按需手动跑」—— 比每次 push 都白跑更诚实。
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/build.rs'
      - 'rust-toolchain*'
      - '.github/workflows/macos-arm64-build.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/build.rs'
      - 'rust-toolchain*'
      - '.github/workflows/macos-arm64-build.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-build:
    name: "LLVM/OPT ${{ matrix.llvm-version[0] }} MacOS"
    runs-on: macos-latest
    env:
      BUILD_OUTPUT_PATH: target/release
    strategy:
      fail-fast: false
      matrix:
        llvm-version:
          - ["18", "18-1", "181"]
          - ["19", "19-1", "191"]
          - ["20", "20-1", "201"]
          - ["21", "21-1", "211"]
          - ["22", "22-1", "221"]
          - ["23", "23-1", "231"]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Library/Caches/Homebrew
            /opt/homebrew/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-downloads-llvm-${{ matrix.llvm-version[0] }}-v2
          restore-keys: |
            ${{ runner.os }}-homebrew-downloads-llvm-${{ matrix.llvm-version[0] }}-v2

      - name: Install Homebrew LLVM (clang) and set env dynamically
        run: |
          set -euo pipefail
          major=${{ matrix.llvm-version[0] }}
          suffix=${{ matrix.llvm-version[2] }}
          echo "Installing llvm@${major} via Homebrew"
          brew update
          # Prefer bottled binaries to avoid building from source; fall back to normal install if bottles not available
          if ! brew install --force-bottle "llvm@${major}"; then
            brew install "llvm@${major}"
          fi
          brew link --force --overwrite "llvm@${major}" || true
          # Get the Homebrew prefix for the installed llvm formula (usually /opt/homebrew/opt/llvm@<major>)
          prefix=$(brew --prefix "llvm@${major}")
          "${prefix}/bin/llvm-config" --version
          echo "Found llvm prefix: ${prefix}"
          # Use suffix from matrix for the llvm-sys env var name (e.g. 201)
          env_name="LLVM_SYS_${suffix}_PREFIX"
          echo "${env_name}=${prefix}" >> $GITHUB_ENV
          # Ensure brewed clang is on PATH for subsequent steps
          echo "PATH=${prefix}/bin:$PATH" >> $GITHUB_ENV

      - name: Build libamice.dylib (Release)
        run: |
          cargo b --release --no-default-features --features llvm${{ matrix.llvm-version[1] }}

      - name: Upload libamice.dylib
        uses: actions/upload-artifact@v4
        with:
          name: libamice-llvm${{ matrix.llvm-version[0] }}-macos
          path: ${{ env.BUILD_OUTPUT_PATH }}/libamice.dylib
          retention-days: 30
